# All of the package requirements defined here are overridable in environments
packages:
  # Common packages versions
  cmake:
   require:
   - '@3.31.12'
  python:
   require:
   - '@3.12.13'
  openmpi:
   require:
   - '@5.0.8'

  # Common base compiler versions
  gcc:
    # NOTE: We use prefer because packages need to be built with both gcc@8.5.0 and later gccs
    prefer:
    - '@15.1.0'
  intel-oneapi-compilers-classic:
    require:
    - '@2021.10.0'
  intel-oneapi-compilers:
    require:
    - '@2025.3.2'
