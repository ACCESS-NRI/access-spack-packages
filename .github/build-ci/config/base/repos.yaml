# These are sensible defaults for manifests in build-ci, and can be overridden.
# We clone these repos under the environment because it is quicker for spack
# to clone the repo fresh rather than fetch/unshallow/merge new changes
# as the image itself becomes more and more out of date.
### Don't edit this file - prefer to override it in a higher scope ###
repos:
  access_spack_packages:
    git: https://github.com/ACCESS-NRI/access-spack-packages.git
    branch: api-v2
    destination: $env/package-repos/access-spack-packages
  builtin:
    git: https://github.com/ACCESS-NRI/upstream-spack-packages.git
    branch: access/v1.1
    destination: $env/package-repos/spack-packages
